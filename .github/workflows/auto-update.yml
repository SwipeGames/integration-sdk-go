name: Auto-update SDK

on:
  workflow_dispatch:
    inputs:
      public_api_version:
        description: "Target public-api version (default: latest tag from repo)"
        required: false
        type: string
        default: ""
      auto_merge:
        description: "Auto-merge PR if tests pass"
        type: boolean
        default: false
      auto_release:
        description: "Auto-create release after merge (implies auto_merge)"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
      tests_passed: ${{ steps.final-tests.outputs.passed }}
      target_version: ${{ steps.versions.outputs.target }}

    steps:
      - name: Generate a token
        id: generate-token
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout SDK repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout public-api repo
        uses: actions/checkout@v4
        with:
          repository: SwipeGames/public-api
          path: public-api
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Detect versions
        id: versions
        run: |
          CURRENT=$(grep 'github.com/swipegames/public-api/api/v1.0/core/types' go.mod | awk '{print $2}' | sed 's/^v//')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.public_api_version }}" ]; then
            TARGET="${{ inputs.public_api_version }}"
          else
            # Tags are prefixed with module path (e.g. "api/v1.0/core/types/v1.2.21") — extract just the version
            TARGET=$(cd public-api && git tag --sort=-v:refname | grep '^api/v1.0/core/types/v' | head -1 | sed 's|.*/v||')
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          echo "Current version: $CURRENT"
          echo "Target version:  $TARGET"

          if [ "$CURRENT" = "$TARGET" ]; then
            echo "Already up to date — nothing to do."
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing branch
        if: steps.versions.outputs.up_to_date == 'false'
        id: check-branch
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          BRANCH="auto-update/public-api-v${TARGET}"
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate public-api diff
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        run: |
          CURRENT="${{ steps.versions.outputs.current }}"
          TARGET="${{ steps.versions.outputs.target }}"

          cd public-api

          # Generate diff between versions (exclude Node code, lock files, and generated schema docs)
          git diff "v${CURRENT}..v${TARGET}" -- api/ docs/ \
            ':!**/package-lock.json' ':!**/node_modules' ':!**/*.ts' ':!**/*.js' \
            ':!**/schemas/*.schema.mdx' \
            > /tmp/public-api-diff.txt 2>/dev/null || true

          # Extract changelog excerpt if available
          if [ -f docs/changes-log.md ]; then
            cp docs/changes-log.md /tmp/public-api-changelog.md
          fi

          cd ..
          echo "Diff size: $(wc -c < /tmp/public-api-diff.txt) bytes"

      - name: Create branch
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          git checkout -b "auto-update/public-api-v${TARGET}"

      - name: Update dependencies
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          go get "github.com/swipegames/public-api/api/v1.0/core/types@v${TARGET}"
          go get "github.com/swipegames/public-api/api/v1.0/swipegames-integration/types@v${TARGET}"
          go mod tidy

      - name: Run initial tests
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        id: initial-tests
        continue-on-error: true
        run: |
          go test ./... && go vet ./...
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code for SDK update
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        id: claude
        # Never let a Claude-side failure (turn/time limit, transient API error)
        # discard the dependency bump — downstream steps still open a PR,
        # labelled needs-review when the tests don't pass.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ secrets.BEDROCK_REGION }}
          CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
        with:
          use_bedrock: "true"
          allowed_bots: "swipegames-example-app[bot]"
          prompt: |
            Read the prompt file at .github/prompts/auto-update.md and follow its instructions.

            Environment context:
            - PUBLIC_API_DIFF_FILE: /tmp/public-api-diff.txt
            - PUBLIC_API_REPO_PATH: ${{ github.workspace }}/public-api
            - CURRENT_VERSION: ${{ steps.versions.outputs.current }}
            - TARGET_VERSION: ${{ steps.versions.outputs.target }}

            Initial tests passed: ${{ steps.initial-tests.outputs.passed || 'false' }}

            IMPORTANT: After making all changes, run `go test ./...` and `go vet ./...` to verify everything works. Fix any failures before finishing.

            IMPORTANT: As your FINAL step, write a concise markdown summary of the SDK changes you made to /tmp/sdk-changes-summary.md. This will be included in the PR description. Focus on what changed from the SDK user's perspective (new methods, new types, changed signatures, new validations, etc.). Use bullet points. Do NOT include internal implementation details.
          direct_prompt: true
          # No --max-turns: a large public-api diff legitimately needs more turns
          # than any fixed number we'd guess. timeout_minutes is the real backstop.
          # Bedrock global cross-region inference profile. Note: Opus 4.7+ dropped
          # the "-v1" suffix that 4.6 and earlier carried — the ID is exactly as
          # published on the model card, not a pattern to extrapolate.
          claude_args: '--model global.anthropic.claude-opus-4-8 --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep"'
          timeout_minutes: "30"

      - name: Run final tests
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        id: final-tests
        continue-on-error: true
        run: |
          go test ./... && go vet ./... && go build ./...
          if [ $? -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          BRANCH="auto-update/public-api-v${TARGET}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all changes except the public-api checkout
          git add -A ':!public-api'
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }

          git commit -m "build(update): update SDK to use swipegames/public-api v${TARGET}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "${BRANCH}"

      - name: Create PR
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          CURRENT="${{ steps.versions.outputs.current }}"
          TESTS_PASSED="${{ steps.final-tests.outputs.passed }}"
          CLAUDE_OUTCOME="${{ steps.claude.outcome }}"

          if [ "$TESTS_PASSED" = "true" ] && [ "$CLAUDE_OUTCOME" = "success" ]; then
            LABEL="auto-update:passing"
          else
            LABEL="auto-update:needs-review"
          fi

          # Ensure labels exist
          gh label create "auto-update:passing" --color "0E8A16" --description "Auto-update PR with passing tests" 2>/dev/null || true
          gh label create "auto-update:needs-review" --color "D93F0B" --description "Auto-update PR that needs manual review" 2>/dev/null || true

          # Read Claude-generated changes summary
          CHANGES=""
          if [ -f /tmp/sdk-changes-summary.md ]; then
            CHANGES=$(cat /tmp/sdk-changes-summary.md)
          else
            CHANGES="No detailed changes summary available."
          fi

          # Flag a Claude step that errored out — its work may be incomplete.
          CLAUDE_NOTE=""
          if [ "$CLAUDE_OUTCOME" != "success" ]; then
            CLAUDE_NOTE="> ⚠️ The Claude step did not complete successfully (\`${CLAUDE_OUTCOME}\`). The SDK changes below may be partial — review before merging. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi

          # Build PR body
          BODY=$(cat <<EOF
          ## Summary

          Updates \`swipegames/public-api\` from \`v${CURRENT}\` to \`v${TARGET}\`.

          ${CLAUDE_NOTE}

          **Tests:** $([ "$TESTS_PASSED" = "true" ] && echo "✅ Passing" || echo "❌ Failing — manual review required")

          ## Changes

          ${CHANGES}
          EOF
          )

          PR_URL=$(gh pr create \
            --title "build(update): update SDK to use swipegames/public-api v${TARGET}" \
            --body "$BODY" \
            --label "$LABEL" \
            --base main)

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created PR: $PR_URL"

      - name: Enable auto-merge
        if: >-
          steps.versions.outputs.up_to_date == 'false' &&
          steps.check-branch.outputs.exists == 'false' &&
          steps.final-tests.outputs.passed == 'true' &&
          (inputs.auto_merge || inputs.auto_release)
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pr_url }}" --auto --squash

      # Fires on every run that produced an update (always()), independent of the
      # auto-merge / auto-release inputs — so disabling auto-merge does not suppress it.
      # Compute the notification text here rather than inline in the Slack step.
      # The old inline ternary keyed solely off final-tests.outputs.passed, so every
      # non-"true" value — including empty because the step never ran — rendered as
      # "❌ Tests failing". When the Claude step aborted the job, that reported a test
      # failure that had never happened. Report each stage on its own line instead,
      # so "tests failed", "tests never ran" and "Claude died" stay distinguishable.
      - name: Build Slack status
        id: slack-status
        if: always() && steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        run: |
          CLAUDE_OUTCOME="${{ steps.claude.outcome }}"
          TESTS_OUTCOME="${{ steps.final-tests.outcome }}"
          TESTS_PASSED="${{ steps.final-tests.outputs.passed }}"
          PR_URL="${{ steps.create-pr.outputs.pr_url }}"

          COLOR="good"

          if [ "$CLAUDE_OUTCOME" = "success" ]; then
            CLAUDE_LINE="Claude: ✅ completed"
          else
            CLAUDE_LINE="Claude: ❌ ${CLAUDE_OUTCOME:-did not run}"
            COLOR="danger"
          fi

          if [ "$TESTS_PASSED" = "true" ]; then
            TESTS_LINE="Tests: ✅ passing"
          elif [ "$TESTS_OUTCOME" = "failure" ] || [ "$TESTS_OUTCOME" = "success" ]; then
            TESTS_LINE="Tests: ❌ failing"
            COLOR="danger"
          else
            TESTS_LINE="Tests: ⚠️ did not run (${TESTS_OUTCOME:-skipped})"
            COLOR="danger"
          fi

          if [ -n "$PR_URL" ]; then
            PR_LINE="$PR_URL"
          else
            PR_LINE="No PR was created — see the run log."
          fi

          echo "message=${CLAUDE_LINE}\n${TESTS_LINE}\n${PR_LINE}" >> "$GITHUB_OUTPUT"
          echo "color=${COLOR}" >> "$GITHUB_OUTPUT"

      - name: Slack notification
        if: always() && steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false' && env.SLACK_WEBHOOK != ''
        continue-on-error: true
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Go SDK auto-update → public-api v${{ steps.versions.outputs.target }}"
          SLACK_MESSAGE: "${{ steps.slack-status.outputs.message }}"
          SLACK_COLOR: ${{ steps.slack-status.outputs.color }}
          SLACK_FOOTER: "integration-sdk-go • ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG_MINIMAL: "true"

  release:
    needs: update
    if: inputs.auto_release && needs.update.outputs.tests_passed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Wait for PR to merge
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          PR_URL="${{ needs.update.outputs.pr_url }}"
          echo "Waiting for PR to merge: $PR_URL"

          for i in $(seq 1 30); do
            STATE=$(gh pr view "$PR_URL" --json state -q '.state')
            if [ "$STATE" = "MERGED" ]; then
              echo "PR merged!"
              exit 0
            elif [ "$STATE" = "CLOSED" ]; then
              echo "PR was closed without merging."
              exit 1
            fi
            echo "Attempt $i/30 — PR state: $STATE — waiting 30s..."
            sleep 30
          done

          echo "Timed out waiting for PR to merge (15 min)."
          exit 1

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          TARGET="${{ needs.update.outputs.target_version }}"
          gh release create "v${TARGET}" \
            --title "v${TARGET}" \
            --generate-notes
          echo "Release v${TARGET} created — Go modules use git tags directly."
