name: Auto-update SDK

on:
  workflow_dispatch:
    inputs:
      public_api_version:
        description: "Target public-api version (default: latest tag from repo)"
        required: false
        type: string
        default: ""
      auto_merge:
        description: "Auto-merge PR if tests pass"
        type: boolean
        default: false
      auto_release:
        description: "Auto-create release after merge (implies auto_merge)"
        type: boolean
        default: false

# Model transport: Claude Code talks to the LiteLLM gateway's Anthropic-compatible /v1/messages
# endpoint with a LiteLLM virtual key (LITELLM_CLAUDE_API_KEY), and LiteLLM forwards to Bedrock.
# This repo is public, so it cannot use the in-cluster self-hosted runners (and the in-cluster
# service URL). The GitHub-hosted runner reaches LiteLLM through the Cloudflare tunnel instead;
# Cloudflare Access lets it in with the `github-actions-litellm` service token (ENG-2872).
env:
  # LiteLLM base URL WITHOUT /v1 (Claude Code appends /v1/messages itself).
  LITELLM_BASE_URL: https://litellm.internal.swipegames.io
  # The `model_name` in the gateway's model_list (→ bedrock/global.anthropic.claude-opus-4-8).
  CLAUDE_MODEL: bedrock-claude-opus-4-8-reviewer

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
      tests_passed: ${{ steps.final-tests.outputs.passed }}
      target_version: ${{ steps.versions.outputs.target }}

    steps:
      - name: Verify gateway, key and model
        # Fail in seconds instead of inside claude-code-action's retry loop: secrets not
        # available, Cloudflare Access rejecting the service token, LiteLLM rejecting the
        # virtual key, or the key not allowed the model.
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_CLAUDE_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_LITELLM_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_LITELLM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in LITELLM_API_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for ${name} is not available to this repository."
              exit 1
            fi
          done
          # Credentials via headers on stdin, never on the command line (visible in ps).
          # Without a valid service token Cloudflare Access answers 302 (login page), which
          # --fail-with-body does not treat as an error, so the jq check below catches it.
          MODELS=$(printf 'Authorization: Bearer %s\nCF-Access-Client-Id: %s\nCF-Access-Client-Secret: %s\n' \
              "$LITELLM_API_KEY" "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" \
            | curl -sS --fail-with-body --max-time 20 -H @- "${LITELLM_BASE_URL%/}/v1/models") || {
            echo "::error::LiteLLM ${LITELLM_BASE_URL} unreachable or rejected the key: $MODELS"
            exit 1
          }
          if ! jq -e '.data' <<<"$MODELS" >/dev/null 2>&1; then
            echo "::error::No model list from ${LITELLM_BASE_URL} — Cloudflare Access likely rejected the service token."
            exit 1
          fi
          if ! jq -e --arg m "$CLAUDE_MODEL" '.data[]? | select(.id == $m)' <<<"$MODELS" >/dev/null; then
            echo "::error::Model '$CLAUDE_MODEL' is not available to this virtual key. Visible models:"
            jq -r '.data[]?.id' <<<"$MODELS" || true
            exit 1
          fi
          echo "Using LiteLLM at $LITELLM_BASE_URL with model $CLAUDE_MODEL"

      - name: Generate a token
        id: generate-token
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout SDK repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout public-api repo
        uses: actions/checkout@v4
        with:
          repository: SwipeGames/public-api
          path: public-api
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Detect versions
        id: versions
        run: |
          CURRENT=$(grep 'github.com/swipegames/public-api/api/v1.0/core/types' go.mod | awk '{print $2}' | sed 's/^v//')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.public_api_version }}" ]; then
            TARGET="${{ inputs.public_api_version }}"
          else
            # Tags are prefixed with module path (e.g. "api/v1.0/core/types/v1.2.21") — extract just the version
            TARGET=$(cd public-api && git tag --sort=-v:refname | grep '^api/v1.0/core/types/v' | head -1 | sed 's|.*/v||')
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          echo "Current version: $CURRENT"
          echo "Target version:  $TARGET"

          if [ "$CURRENT" = "$TARGET" ]; then
            echo "Already up to date — nothing to do."
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing branch
        if: steps.versions.outputs.up_to_date == 'false'
        id: check-branch
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          BRANCH="auto-update/public-api-v${TARGET}"
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate public-api diff
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        run: |
          CURRENT="${{ steps.versions.outputs.current }}"
          TARGET="${{ steps.versions.outputs.target }}"

          cd public-api

          # Generate diff between versions (exclude Node code, lock files, and generated schema docs)
          git diff "v${CURRENT}..v${TARGET}" -- api/ docs/ \
            ':!**/package-lock.json' ':!**/node_modules' ':!**/*.ts' ':!**/*.js' \
            ':!**/schemas/*.schema.mdx' \
            > /tmp/public-api-diff.txt 2>/dev/null || true

          # Extract changelog excerpt if available
          if [ -f docs/changes-log.md ]; then
            cp docs/changes-log.md /tmp/public-api-changelog.md
          fi

          cd ..
          echo "Diff size: $(wc -c < /tmp/public-api-diff.txt) bytes"

      - name: Create branch
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          git checkout -b "auto-update/public-api-v${TARGET}"

      - name: Update dependencies
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          go get "github.com/swipegames/public-api/api/v1.0/core/types@v${TARGET}"
          go get "github.com/swipegames/public-api/api/v1.0/swipegames-integration/types@v${TARGET}"
          go mod tidy

      - name: Run initial tests
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        id: initial-tests
        continue-on-error: true
        run: |
          go test ./... && go vet ./...
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code for SDK update
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        id: claude
        timeout-minutes: 30
        uses: anthropics/claude-code-action@v1
        env:
          # Anthropic-compatible endpoint. The virtual key goes in as the anthropic_api_key
          # input below; Claude Code sends it as x-api-key.
          ANTHROPIC_BASE_URL: ${{ env.LITELLM_BASE_URL }}
          # Cloudflare Access service token, sent on every request (one header per line).
          ANTHROPIC_CUSTOM_HEADERS: |-
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_LITELLM_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_LITELLM_CLIENT_SECRET }}
          # Every model alias Claude Code can resolve must map to a name the gateway serves.
          # Claude Code uses the haiku slot for background calls — unmapped, those request
          # real Anthropic ids the gateway lacks.
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ env.CLAUDE_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ env.CLAUDE_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ env.CLAUDE_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ env.CLAUDE_MODEL }}
          # The request still ends at Bedrock, which rejects the billing header Claude Code
          # injects (anthropics/claude-code#24168).
          CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
        with:
          anthropic_api_key: ${{ secrets.LITELLM_CLAUDE_API_KEY }}
          allowed_bots: "swipegames-example-app[bot]"
          prompt: |
            Read the prompt file at .github/prompts/auto-update.md and follow its instructions.

            Environment context:
            - PUBLIC_API_DIFF_FILE: /tmp/public-api-diff.txt
            - PUBLIC_API_REPO_PATH: ${{ github.workspace }}/public-api
            - CURRENT_VERSION: ${{ steps.versions.outputs.current }}
            - TARGET_VERSION: ${{ steps.versions.outputs.target }}

            Initial tests passed: ${{ steps.initial-tests.outputs.passed || 'false' }}

            IMPORTANT: After making all changes, run `go test ./...` and `go vet ./...` to verify everything works. Fix any failures before finishing.

            IMPORTANT: As your FINAL step, write a concise markdown summary of the SDK changes you made to /tmp/sdk-changes-summary.md. This will be included in the PR description. Focus on what changed from the SDK user's perspective (new methods, new types, changed signatures, new validations, etc.). Use bullet points. Do NOT include internal implementation details.
          claude_args: '--model ${{ env.CLAUDE_MODEL }} --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep"'

      - name: Run final tests
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        id: final-tests
        continue-on-error: true
        run: |
          go test ./... && go vet ./... && go build ./...
          if [ $? -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          BRANCH="auto-update/public-api-v${TARGET}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all changes except the public-api checkout
          git add -A ':!public-api'
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }

          git commit -m "build(update): update SDK to use swipegames/public-api v${TARGET}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "${BRANCH}"

      - name: Create PR
        if: steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false'
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          TARGET="${{ steps.versions.outputs.target }}"
          CURRENT="${{ steps.versions.outputs.current }}"
          TESTS_PASSED="${{ steps.final-tests.outputs.passed }}"

          if [ "$TESTS_PASSED" = "true" ]; then
            LABEL="auto-update:passing"
          else
            LABEL="auto-update:needs-review"
          fi

          # Ensure labels exist
          gh label create "auto-update:passing" --color "0E8A16" --description "Auto-update PR with passing tests" 2>/dev/null || true
          gh label create "auto-update:needs-review" --color "D93F0B" --description "Auto-update PR that needs manual review" 2>/dev/null || true

          # Read Claude-generated changes summary
          CHANGES=""
          if [ -f /tmp/sdk-changes-summary.md ]; then
            CHANGES=$(cat /tmp/sdk-changes-summary.md)
          else
            CHANGES="No detailed changes summary available."
          fi

          # Build PR body
          BODY=$(cat <<EOF
          ## Summary

          Updates \`swipegames/public-api\` from \`v${CURRENT}\` to \`v${TARGET}\`.

          **Tests:** $([ "$TESTS_PASSED" = "true" ] && echo "✅ Passing" || echo "❌ Failing — manual review required")

          ## Changes

          ${CHANGES}
          EOF
          )

          PR_URL=$(gh pr create \
            --title "build(update): update SDK to use swipegames/public-api v${TARGET}" \
            --body "$BODY" \
            --label "$LABEL" \
            --base main)

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created PR: $PR_URL"

      - name: Enable auto-merge
        if: >-
          steps.versions.outputs.up_to_date == 'false' &&
          steps.check-branch.outputs.exists == 'false' &&
          steps.final-tests.outputs.passed == 'true' &&
          (inputs.auto_merge || inputs.auto_release)
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pr_url }}" --auto --squash

      # Fires on every run that produced an update (always()), independent of the
      # auto-merge / auto-release inputs — so disabling auto-merge does not suppress it.
      - name: Slack notification
        if: always() && steps.versions.outputs.up_to_date == 'false' && steps.check-branch.outputs.exists == 'false' && env.SLACK_WEBHOOK != ''
        continue-on-error: true
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Go SDK auto-update → public-api v${{ steps.versions.outputs.target }}"
          SLACK_MESSAGE: "${{ steps.final-tests.outputs.passed == 'true' && '✅ Tests passing' || '❌ Tests failing' }}\n${{ steps.create-pr.outputs.pr_url }}"
          SLACK_COLOR: ${{ steps.final-tests.outputs.passed == 'true' && 'good' || 'danger' }}
          SLACK_FOOTER: "integration-sdk-go • ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG_MINIMAL: "true"

  release:
    needs: update
    if: inputs.auto_release && needs.update.outputs.tests_passed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Wait for PR to merge
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          PR_URL="${{ needs.update.outputs.pr_url }}"
          echo "Waiting for PR to merge: $PR_URL"

          for i in $(seq 1 30); do
            STATE=$(gh pr view "$PR_URL" --json state -q '.state')
            if [ "$STATE" = "MERGED" ]; then
              echo "PR merged!"
              exit 0
            elif [ "$STATE" = "CLOSED" ]; then
              echo "PR was closed without merging."
              exit 1
            fi
            echo "Attempt $i/30 — PR state: $STATE — waiting 30s..."
            sleep 30
          done

          echo "Timed out waiting for PR to merge (15 min)."
          exit 1

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          TARGET="${{ needs.update.outputs.target_version }}"
          gh release create "v${TARGET}" \
            --title "v${TARGET}" \
            --generate-notes
          echo "Release v${TARGET} created — Go modules use git tags directly."
